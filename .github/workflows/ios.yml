name: iOS

# macOS minutes are expensive on private repositories (x10), so this runs only when iOS code,
# shared protocol files or this workflow change, or on demand.
on:
  push:
    branches: [main]
    paths: ['ios/**', 'shared/**', 'windows/Nexus.Agent/**', 'windows/Nexus.Core/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: NexusKit tests + unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build NexusKit tests
        run: swift build --build-tests --package-path ios/NexusKit
      - name: Start a real Nexus.Agent and open pairing (answer "y" as the PC owner)
        run: |
          dotnet build windows/Nexus.Agent -c Release -o "$RUNNER_TEMP/agent"
          export NEXUS_DATA_DIR="$RUNNER_TEMP/nexus-data"
          export NEXUS_DEV_FILE_KEY="$RUNNER_TEMP/nexus-dev-key/device.key"
          nohup "$RUNNER_TEMP/agent/Nexus.Agent" > "$RUNNER_TEMP/agent.log" 2>&1 &
          for i in $(seq 1 60); do nc -z 127.0.0.1 47800 && break; sleep 1; done
          nc -z 127.0.0.1 47800
          (echo y | "$RUNNER_TEMP/agent/Nexus.Agent" pair > "$RUNNER_TEMP/pair.txt" 2>&1 &)
      - name: NexusKit tests (shared fixtures with C#, live agent)
        env:
          NEXUS_TEST_PAIR_OUTPUT: ${{ runner.temp }}/pair.txt
        run: swift test --skip-build --package-path ios/NexusKit
      - name: Agent output
        if: always()
        run: |
          cat "$RUNNER_TEMP/pair.txt" || true
          tail -n 50 "$RUNNER_TEMP/agent.log" || true
          tail -n 20 "$RUNNER_TEMP/nexus-data/audit.log" || true
      - name: Install XcodeGen (CI only)
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/NexusPC.xcodeproj -scheme NexusPC -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NexusPC.app Payload/
          zip -qry NexusPC-unsigned.ipa Payload
          ls -l NexusPC-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NexusPC-unsigned-ipa
          path: NexusPC-unsigned.ipa
          retention-days: 14

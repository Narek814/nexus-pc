name: iOS

# macOS minutes are expensive on private repositories (x10), so this runs only when iOS code,
# shared protocol files or this workflow change, or on demand.
on:
  push:
    branches: [main]
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: NexusKit tests + unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: NexusKit tests (shared fixtures with C#)
        run: swift test --package-path ios/NexusKit
      - name: Install XcodeGen (CI only)
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/NexusPC.xcodeproj -scheme NexusPC -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NexusPC.app Payload/
          zip -qry NexusPC-unsigned.ipa Payload
          ls -l NexusPC-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NexusPC-unsigned-ipa
          path: NexusPC-unsigned.ipa
          retention-days: 14

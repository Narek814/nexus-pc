name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest exercises the Windows-only code paths: machine certificate store,
        # data directory ACLs and the admin pipe ACL.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test windows/Nexus.slnx --configuration Release --logger "console;verbosity=detailed"

  schemas:
    name: Schema fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "jsonschema>=4.18,<5"
      - run: python -I tools/check_fixtures.py

  qr:
    name: QR decoder check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Independent decoder, used only to verify our encoder; never shipped.
      - run: pip install "zxing-cpp>=2.2,<3" "pillow>=10"
      - run: python -I tools/check_qr.py

  installer:
    name: Installer (build + install/upgrade/uninstall on Windows)
    runs-on: windows-latest
    env:
      # PawnIO_setup.exe 2.2.0, pinned: used by the download check and by Nexus.Setup (-p:PawnIoSha256).
      PAWNIO_SHA256: 1f519a22e47187f70a1379a48ca604981c4fcf694f4e65b734aaa74a9fba3032
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Agent and Tray (with .NET inside) into payload.zip, add OpenRGB and PawnIO
        shell: pwsh
        run: |
          $v = "0.2.${{ github.run_number }}"
          # Self-contained: the PC needs no separate .NET installation.
          dotnet publish windows/Nexus.Agent -c Release -r win-x64 --self-contained true -p:Version=$v -o staging/Agent
          if ($LASTEXITCODE) { exit 1 }
          dotnet publish windows/Nexus.Tray -c Release -r win-x64 --self-contained true -p:Version=$v -o staging/Tray
          if ($LASTEXITCODE) { exit 1 }

          # Third-party programs, unmodified, pinned by SHA-256 (windows/ThirdParty/README.md).
          function Fetch($url, $sha, $out) {
            Invoke-WebRequest -Uri $url -OutFile $out -MaximumRetryCount 4 -RetryIntervalSec 10
            $actual = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $sha) { Write-Error "SHA-256 mismatch for $url : $actual"; exit 1 }
            "ok: $out $actual"
          }
          Fetch "https://codeberg.org/OpenRGB/OpenRGB/releases/download/release_1.1/OpenRGB_1.1_Windows_64_8e16de2.zip" "63291726c6fc84eb479ef2ee752e97e1187f6ce9c49fd27eee40ded588a8172a" "$env:RUNNER_TEMP/openrgb.zip"
          Expand-Archive "$env:RUNNER_TEMP/openrgb.zip" -DestinationPath "$env:RUNNER_TEMP/openrgb"
          Move-Item "$env:RUNNER_TEMP/openrgb/OpenRGB Windows 64-bit" staging/OpenRGB
          Copy-Item windows/ThirdParty/OpenRGB/LICENSE staging/OpenRGB/LICENSE.txt
          Copy-Item windows/ThirdParty/README.md staging/OpenRGB/NEXUS-PC-NOTICE.md
          if (-not (Test-Path staging/OpenRGB/OpenRGB.exe)) { Write-Error "OpenRGB.exe missing"; exit 1 }
          # The agent starts only this exact OpenRGB.exe (OpenRgbHost.PinnedSha256); keep both values equal.
          $openRgbExeSha = (Get-FileHash staging/OpenRGB/OpenRGB.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($openRgbExeSha -ne "e26ae71162795a8abcfb90c05c1572a00ba06ca63b886aca57392a0138963b1e") { Write-Error "SHA-256 mismatch for OpenRGB.exe : $openRgbExeSha"; exit 1 }
          "ok: OpenRGB.exe $openRgbExeSha"

          New-Item -ItemType Directory staging/PawnIO | Out-Null
          Fetch "https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe" $env:PAWNIO_SHA256 staging/PawnIO/PawnIO_setup.exe
          $sig = Get-AuthenticodeSignature staging/PawnIO/PawnIO_setup.exe
          "PawnIO signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "PawnIO_setup.exe signature is not valid"; exit 1 }

          Set-Content -Path staging/version.txt -Value $v -NoNewline

          # manifest.json: every file under staging/ with size and SHA-256 (relative paths, '/').
          $root = (Resolve-Path staging).Path.TrimEnd('\', '/')
          $manifestPath = Join-Path $root 'manifest.json'
          $files = @(Get-ChildItem staging -Recurse -File -Force | Where-Object { $_.FullName -ne $manifestPath } | Sort-Object FullName | ForEach-Object {
            [ordered]@{
              path   = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
              size   = $_.Length
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $dups = @($files | Group-Object { $_.path.ToLowerInvariant() } | Where-Object Count -gt 1)
          if ($dups.Count) { Write-Error "Duplicate paths in staging (case-insensitive): $($dups.Name -join ', ')"; exit 1 }
          foreach ($req in 'version.txt', 'PawnIO/PawnIO_setup.exe', 'OpenRGB/OpenRGB.exe', 'Agent/Nexus.Agent.exe') {
            if (-not ($files | Where-Object { $_.path -ceq $req })) { Write-Error "manifest.json misses $req"; exit 1 }
          }
          $json = [ordered]@{ version = 1; files = $files } | ConvertTo-Json -Depth 5 -Compress
          [System.IO.File]::WriteAllText($manifestPath, $json, (New-Object System.Text.UTF8Encoding $false))
          "manifest.json: $($files.Count) files"

          Compress-Archive -Path staging/* -DestinationPath windows/Nexus.Setup/payload.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path windows/Nexus.Setup/payload.zip).Path)
          $atRoot = @($zip.Entries | Where-Object { $_.FullName -eq 'manifest.json' }).Count
          $zipNames = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') } | Where-Object { -not $_.EndsWith('/') -and $_ -cne 'manifest.json' })
          $zip.Dispose()
          $manNames = @($files | ForEach-Object { $_.path })
          if ($zipNames.Count -ne $manNames.Count) { Write-Error "payload.zip has $($zipNames.Count) file entries, manifest.json has $($manNames.Count)"; exit 1 }
          $diff = @(Compare-Object -CaseSensitive -ReferenceObject $manNames -DifferenceObject $zipNames)
          if ($diff.Count) { Write-Error "payload.zip and manifest.json differ: $(($diff | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }) -join ', ')"; exit 1 }
          "ok: payload.zip entries match manifest.json ($($manNames.Count) files)"
          if ($atRoot -ne 1) { Write-Error "manifest.json is not at the root of payload.zip"; exit 1 }
          "ok: manifest.json at the root of payload.zip"
      - name: Build NexusPC-Setup.exe
        shell: pwsh
        run: |
          dotnet publish windows/Nexus.Setup -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PawnIoSha256=$env:PAWNIO_SHA256 -p:PawnIoLeafCertSha256=8166cb6a0b4d058ecf5e499193e3ee74f1da7b3aaa6fde89ca2111e61f0af792 -p:PawnIoVersion=2.2.0 -p:Version=0.2.${{ github.run_number }} -o out
          if ($LASTEXITCODE) { exit 1 }
          Get-Item out/NexusPC-Setup.exe | Format-List Name, Length
      - name: Install, check, upgrade, uninstall
        shell: pwsh
        run: |
          function Check($ok, $what) { if (-not $ok) { Write-Error "FAILED: $what"; Get-Content $env:TEMP\NexusPC-Setup.log -ErrorAction SilentlyContinue; exit 1 } else { "ok: $what" } }
          function Running { (Get-Service NexusPCAgent -ErrorAction SilentlyContinue).Status -eq 'Running' }
          function Listening { for ($i = 0; $i -lt 30; $i++) { if (Get-NetTCPConnection -LocalPort 47800 -State Listen -ErrorAction SilentlyContinue) { return $true }; Start-Sleep 1 }; $false }
          $agent = "$env:ProgramFiles\NexusPC\Agent\Nexus.Agent.exe"

          & .\out\NexusPC-Setup.exe --quiet --no-tray; Check ($LASTEXITCODE -eq 0) "fresh install exit code"
          Check (Running) "service running"
          Check (Listening) "agent listens on 47800"
          & $agent status; Check ($LASTEXITCODE -eq 0) "agent answers the admin pipe"
          $rule = Get-NetFirewallRule -DisplayName "Nexus PC Agent"
          Check ($rule.Profile -eq 'Private') "firewall rule is Private only"
          Check ((Get-CimInstance Win32_Service -Filter "Name='NexusPCAgent'").StartMode -eq 'Auto') "service starts automatically"
          Check (Test-Path "$env:ProgramFiles\NexusPC\Tray\Nexus.Tray.exe") "tray installed"
          $shortcut = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Nexus PC.lnk"
          Check (Test-Path $shortcut) "Start menu shortcut"
          Check ((New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath -eq "$env:ProgramFiles\NexusPC\Tray\Nexus.Tray.exe") "shortcut points to the tray"
          Check (Test-Path "$env:ProgramFiles\NexusPC\Agent\hostfxr.dll") "agent carries its own .NET"

          # The service starts the bundled OpenRGB as its SDK server, on loopback only.
          $openrgb = "$env:ProgramFiles\NexusPC\OpenRGB\OpenRGB.exe"
          Check (Test-Path $openrgb) "OpenRGB installed"
          function OpenRgbListening { for ($i = 0; $i -lt 90; $i++) { $c = Get-NetTCPConnection -LocalPort 6742 -State Listen -ErrorAction SilentlyContinue; if ($c) { return $c }; Start-Sleep 1 }; $null }
          $listen = OpenRgbListening
          Check ($null -ne $listen) "OpenRGB SDK server listens on 6742"
          "OpenRGB listens on: $(@($listen).LocalAddress -join ', ')"
          Check (@($listen | Where-Object LocalAddress -ne '127.0.0.1').Count -eq 0) "OpenRGB listens on 127.0.0.1 only"
          $proc = Get-Process OpenRGB -ErrorAction SilentlyContinue | Where-Object Path -eq $openrgb
          Check ($null -ne $proc) "OpenRGB runs from Program Files"
          Check (@(Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object DisplayName -like '*OpenRGB*').Count -eq 0) "no firewall rule for OpenRGB"
          function OpenRgbState { $st = $null; for ($i = 0; $i -lt 60; $i++) { $st = (& $agent status | Out-String | ConvertFrom-Json).openRgb; if ($st -eq 'running') { return $st }; Start-Sleep 1 }; $st }
          $rgbState = OpenRgbState
          "agent reports openRgb: $rgbState"
          Check ($rgbState -eq 'running') "agent owns the bundled OpenRGB (state running, not conflict)"
          $pawnio = Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO'
          "PawnIO installed on the runner: $pawnio"
          Get-Content $env:TEMP\NexusPC-Setup.log | Select-String -Pattern 'PawnIO|OpenRGB' -Context 0,2
          Get-Content $env:TEMP\NexusPC-Setup.log | Select-String -Pattern 'Staging:', 'Unpacked into', 'PawnIO process', 'PawnIO' -SimpleMatch
          Check ($null -ne (Get-Content $env:TEMP\NexusPC-Setup.log | Select-String -Pattern 'Unpacked into' -SimpleMatch)) "setup log has 'Unpacked into'"

          # Found on the owner's PC: an admin console still running Nexus.Agent.exe keeps the DLLs locked.
          $leftover = Start-Process -FilePath $agent -ArgumentList pair -PassThru -WindowStyle Hidden
          Start-Sleep 3
          Check (-not $leftover.HasExited) "leftover 'Nexus.Agent.exe pair' is running before the upgrade"
          & .\out\NexusPC-Setup.exe --quiet --no-tray; Check ($LASTEXITCODE -eq 0) "upgrade over itself while a leftover agent process runs"
          Check (Running) "service running after upgrade"
          Check ($null -ne (OpenRgbListening)) "OpenRGB back after the upgrade (it was running, its files were replaced)"
          Check (@(Get-NetFirewallRule -DisplayName "Nexus PC Agent").Count -eq 1) "still exactly one firewall rule"
          Check (Test-Path "$env:ProgramData\NexusPC") "data kept"

          & .\out\NexusPC-Setup.exe --uninstall --quiet; Check ($LASTEXITCODE -eq 0) "uninstall exit code"
          Check (-not (Get-Service NexusPCAgent -ErrorAction SilentlyContinue)) "service removed"
          Check (-not (Get-Process OpenRGB -ErrorAction SilentlyContinue | Where-Object Path -like "$env:ProgramFiles\NexusPC\*")) "bundled OpenRGB stopped"
          Check (-not (Test-Path "$env:ProgramFiles\NexusPC")) "program files removed"
          Check (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Nexus PC.lnk")) "Start menu shortcut removed"
          Check (-not (Get-NetFirewallRule -DisplayName "Nexus PC Agent" -ErrorAction SilentlyContinue)) "firewall rule removed"
          Check (Test-Path "$env:ProgramData\NexusPC") "data kept after uninstall"

          & .\out\NexusPC-Setup.exe --quiet --no-tray; Check ($LASTEXITCODE -eq 0) "reinstall"
          & .\out\NexusPC-Setup.exe --purge --quiet; Check ($LASTEXITCODE -eq 0) "purge exit code"
          Check (-not (Test-Path "$env:ProgramData\NexusPC")) "data removed by purge"
          Check (-not (Get-ChildItem Cert:\LocalMachine\My | Where-Object Subject -like 'CN=Nexus PC Agent *')) "certificate removed by purge"
      - name: H.264 encoder on this Windows (prints what the encoder produced, or why it is unavailable)
        shell: pwsh
        run: dotnet test windows/Nexus.Tests -c Release --filter "FullyQualifiedName~MediaFoundationEncoderTests" --logger "console;verbosity=detailed"
      - uses: actions/upload-artifact@v4
        with:
          name: NexusPC-Setup
          path: out/NexusPC-Setup.exe
          if-no-files-found: error
